site_name: 'MESQUAL Package Documentation'
site_url: 'https://docs.mesqual.io/'
repo_url: 'https://github.com/helgeesch/mesqual/'

theme:
  name: material
  logo: assets/logo-white.svg
  palette:
    primary: 'teal'
    accent: 'amber'
  features:
    - navigation.tabs
    - content.tabs.link
    - navigation.sections

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 5
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: !relative $config_dir
      check_paths: true

plugins:
  - search
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            heading_level: 2
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_root_members_full_path: false
            show_symbol_type_heading: true
            show_category_heading: false
            show_root_toc_entry: false
            signature_crossrefs: true
            show_signature_annotations: true
            show_signature_type_parameters: true
            members_order: source
            modernize_annotations: true
            separate_signature: true
            merge_init_into_class: false

validation:
  nav:
    omitted_files: warn
  anchors: warn

watch:
  - README.md
  - src/mesqual/skills/mesqual-study/SKILL.md

nav:
  - Home: index.md
  - Guides:
    - Use mesqual in a study: guides/use-in-a-study.md
    - Extend a platform in a study: guides/extend-a-platform-in-a-study.md
