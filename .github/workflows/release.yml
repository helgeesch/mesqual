name: Release

# Steps for a release: see the section "Release" in CHANGELOG.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      - name: Check that the release tag matches the built version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          test -f "dist/mesqual-${TAG#v}.tar.gz" ||
          { echo "::error::Release tag $TAG does not match the built version: $(ls -m dist)"; exit 1; }

      - name: Check the metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    if: github.event_name == 'release' && github.repository == 'helgeesch/mesqual'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mesqual
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.repository == 'helgeesch/mesqual'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mesqual
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
